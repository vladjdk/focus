# Pushing a version tag (v1.2.3) builds the app and publishes a GitHub release
# whose notes are that version's bullets from CHANGELOG.md. Running boards pick
# the release up through their Update button.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test
      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog.mjs notes "$GITHUB_REF_NAME" > notes.md
      - name: Bundle the built app
        run: tar -czf "focus-$GITHUB_REF_NAME.tar.gz" dist server.mjs lib scripts package.json README.md CHANGELOG.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md "focus-$GITHUB_REF_NAME.tar.gz"
